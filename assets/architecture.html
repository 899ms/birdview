<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birdview</title>
  <script>try { if (localStorage.getItem('birdview-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}</script>
  <style>/* BIRDVIEW_CSS */
    #map{flex-shrink:0;min-width:100%;width:auto}#connections{overflow:visible}.map-scroll{align-items:flex-start;max-height:70vh;overflow:auto}.node{width:190px;height:112px;transform:none}.node strong{font-size:13px}.node small{font-size:10px}.node.selected{border-color:var(--mint)}.node small,.node strong{overflow-wrap:anywhere}#evidence{white-space:pre-line}#relations li{font-family:inherit;font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}#relations strong{display:block;font-weight:500}#relations span{color:var(--muted)}.detail{margin-top:18px}aside{max-height:85vh;overflow:auto}.map-heading{gap:18px}#identity{overflow-wrap:anywhere}.task>div:first-child{min-width:0}h1{overflow-wrap:anywhere}.empty{color:var(--muted);font-size:12px}@media(max-width:1000px){aside{display:block;max-height:none}.map-scroll{max-height:55vh}}@media(max-width:600px){.task-count{display:none}}
    main,footer{max-width:none}.workspace{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.map-scroll{max-height:none;flex:none;display:block}.map-area{position:sticky;top:16px}#map{min-width:0;transform-origin:top left;position:absolute;left:0;top:0}#map-stage{position:relative;overflow:hidden;margin:0 auto}aside{max-height:none;overflow:visible}h2,#questions{overflow-wrap:anywhere}#questions{white-space:pre-line}.map-heading{flex-wrap:wrap;padding-right:16px}.map-tools{display:flex;align-items:center;gap:6px;margin-left:auto}#zoom-value{width:48px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums}.node strong{line-height:1.3}.node .node-top{margin-bottom:7px}@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr)}.map-area{position:static}.map-scroll{max-height:none}}@media(max-width:600px){#uncertainty{display:none}}
    .flow-dot{fill:var(--mint);pointer-events:none}.flow-toggle{display:flex;align-items:center;gap:5px;margin-right:8px;font-size:11px;white-space:nowrap}.flow-toggle input{accent-color:var(--mint)}@media(prefers-reduced-motion:reduce){.flow-dot{display:none}}
    .node{border-radius:8px;text-align:center;padding:10px 12px;display:grid;grid-template-rows:18px 34px 28px;row-gap:4px;align-content:center}.node .node-top{justify-content:center;margin:0}.node strong{font-size:13px;line-height:17px;align-self:center;max-height:34px}.node small{font-size:10px;line-height:14px;margin:0;max-height:28px}.node strong,.node small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.node .uncertain-mark{position:absolute;top:8px;right:9px;width:15px;height:15px;font-size:10px;line-height:15px;border:1px solid #b89a54;border-radius:50%;color:#b89a54}.module-meta{font-size:11px;color:var(--muted);margin:10px 0}
  </style>
</head>
<body>
  <header><div class="brand"><span id="brand-icon"></span><strong>Birdview</strong><span class="divider"></span><span class="subtitle">看见 AI 如何改变你的系统</span></div><div class="header-actions"><span class="simulation">架构快照</span><button id="theme" aria-label="切换到浅色" title="切换到浅色"></button></div></header>
  <main>
    <section class="task"><div><div class="eyebrow" id="identity"></div><h1 id="project"></h1></div><div class="task-count"><strong id="count"></strong><span>模块 / 关系</span></div></section>
    <div class="workspace"><section class="map-area" aria-label="项目架构"><div class="map-heading"><span>系统架构</span><span id="uncertainty"></span><div class="map-tools"><button id="zoom-out" title="缩小" aria-label="缩小"></button><output id="zoom-value" aria-label="缩放比例"></output><button id="zoom-in" title="放大" aria-label="放大"></button><button id="fit" title="适配全图" aria-label="适配全图"></button><button id="actual" title="原始大小" aria-label="原始大小"></button></div></div><div class="map-scroll"><div id="map-stage"><div id="map"><svg id="connections" aria-label="模块关系"></svg><div id="nodes"></div></div></div></div><div class="legend"><span>架构快照 · 尚无修改活动</span></div></section>
      <aside><div class="eyebrow">模块详情</div><h2 id="module-name"></h2><p id="responsibility"></p><div class="field-label">文件归属</div><ul id="ownership"></ul><div class="field-label">源码证据</div><div id="evidence"></div><div class="detail"><div class="field-label">待确认</div><p id="questions"></p></div><div class="detail"><div class="field-label">相关连接</div><ul id="relations"></ul></div></aside>
    </div>
  </main>
  <footer><span>Birdview / Architecture-first coding</span><span>架构声明不代表实时运行观测</span></footer>
  <script>/* BIRDVIEW_DATA */
/* BIRDVIEW_JS */</script>
</body>
</html>
