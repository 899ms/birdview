    #relation-view{height:28px;max-width:130px;font-size:11px;padding:3px 6px}#relation-count{font-size:11px;color:var(--muted);margin-right:10px}.node.context-muted{opacity:.5}.edge.context-muted,[data-theme="light"] .edge.context-muted{opacity:.12;filter:none}.map-tools{flex-wrap:wrap}@media(prefers-reduced-motion:reduce){.node{transition:none}}
    .hidden-relations{position:absolute;top:9px;right:9px;color:var(--node-accent);font-size:10px;font-weight:500;line-height:13px;font-variant-numeric:tabular-nums}.hidden-relations[hidden]{display:none}.node:has(.uncertain-mark) .hidden-relations{right:28px}

<body>
  <header><div class="brand"><span id="brand-icon"></span><strong>Birdview</strong></div><section class="task"><div><h1 id="project"></h1></div><div class="task-count"><strong id="count"></strong><span>模块 / 关系</span></div></section><div class="header-actions"><span class="simulation">架构快照</span><button id="theme" aria-label="切换到浅色" title="切换到浅色"></button></div></header>
  <main>
    <div class="workspace"><section class="map-area" aria-label="项目架构"><div class="map-heading"><span>系统架构</span><span id="uncertainty"></span><div class="map-tools"><button id="zoom-out" title="缩小" aria-label="缩小"></button><output id="zoom-value" aria-label="缩放比例"></output><button id="zoom-in" title="放大" aria-label="放大"></button><button id="fit" title="适配全图" aria-label="适配全图"></button><button id="actual" title="原始大小" aria-label="原始大小"></button></div></div><div class="map-scroll"><div id="map-stage"><div id="map"><svg id="connections" aria-label="模块关系"></svg><div id="nodes"></div></div></div></div><div class="legend"><span>架构快照 · 尚无修改活动</span></div></section>
      <aside><div class="eyebrow">模块详情</div><h2 id="module-name"></h2><p id="responsibility"></p><div class="field-label">文件归属</div><ul id="ownership"></ul><div class="field-label">源码证据</div><div id="evidence"></div><div class="detail"><div class="field-label">待确认</div><p id="questions"></p></div><div class="detail"><div class="field-label">相关连接</div><ul id="relations"></ul></div><div class="detail"><div class="field-label">架构标识</div><div class="eyebrow" id="identity"></div></div></aside>
    </div>
  </main>
  <footer><span>Birdview / Architecture-first coding</span><span>架构声明不代表实时运行观测</span></footer>

</body>
