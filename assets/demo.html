<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birdview · 修改范围演示</title>
  <script>try { if (localStorage.getItem('birdview-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}</script>
  <style>/* BIRDVIEW_CSS */</style>
</head>
<body>
  <header><div class="brand"><span data-icon="focus"></span><strong>Birdview</strong><span class="divider"></span><span class="subtitle">看见 AI 如何改变你的系统</span></div><div class="header-actions"><span class="simulation">模拟演示</span><button id="theme" type="button" title="切换到浅色" aria-label="切换到浅色" data-icon="sun"></button></div></header>
  <main>
    <section class="task"><div><div class="eyebrow">FICTIONAL SHOP / TASK 01</div><h1>调整商品缓存过期与回退逻辑</h1></div><div class="task-count"><strong id="scope-count">2 / 6</strong><span>计划涉及模块</span></div></section>
    <div class="workspace">
      <section class="map-area" aria-label="系统架构与修改范围">
        <div class="map-heading"><span>系统视图</span><label class="toggle"><input id="spotlight" type="checkbox" checked>聚光灯</label></div>
        <div class="map-scroll"><div id="map"><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div></div>
        <div class="legend"><span><i class="planned"></i>计划范围</span><span><i class="active"></i>当前目标</span><span><i></i>范围外</span><span class="map-note">6 个模块 · 5 条关系</span></div>
      </section>
      <aside><div class="eyebrow">当前活动 · AI 声明</div><div class="phase-line"><span id="phase"></span><span id="position"></span></div><h2 id="event-title"></h2><p id="reason"></p><div class="field-label">本步文件</div><ul id="files"></ul><div id="checks"></div><div class="detail"><div class="field-label">模块详情</div><h3 id="module-name"></h3><p id="responsibility"></p><div id="ownership"></div><div class="field-label">来源证据 · 虚构示例</div><div id="evidence"></div></div></aside>
    </div>
    <section class="playback" aria-label="模拟活动回放"><div id="steps" class="steps"></div><div class="transport"><div class="buttons"><button id="restart" title="从头重播" aria-label="从头重播" data-icon="rotate-ccw"></button><button id="prev" title="上一步" aria-label="上一步" data-icon="step-back"></button><button id="play" class="primary" title="播放" aria-label="播放" data-icon="play"></button><button id="next" title="下一步" aria-label="下一步" data-icon="step-forward"></button></div><input id="seek" type="range" min="0" max="4" value="1" step="1" aria-label="活动进度"><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="0.5">0.5×</option></select><span class="record-label">模拟记录 / 非实时</span></div></section>
  </main>
  <footer><span>Birdview / Architecture-first coding</span><span>示例文件与验证结果均为虚构</span></footer>
  <script>/* BIRDVIEW_DATA */
/* BIRDVIEW_JS */</script>
</body>
</html>
